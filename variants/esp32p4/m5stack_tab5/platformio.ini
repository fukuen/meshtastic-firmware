[env:m5stack-tab5]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = M5STACK_TAB5
custom_meshtastic_architecture = esp32-p4
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 2
custom_meshtastic_display_name = M5Stack Tab5
custom_meshtastic_tags = M5Stack
custom_meshtastic_has_mui = true

extends = esp32p4_base
;board = m5stack-tab5-p4
board = esp32-p4-evboard
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
;OpenOCD flash method
;upload_protocol = esp-builtin
;Normal method
upload_protocol = esptool
;upload_port = /dev/ttyACM2
build_unflags=
  -D MESHTASTIC_EXCLUDE_WIFI=1
build_flags = 
  ${esp32p4_base.build_flags}
  -D M5STACK_TAB5
  -I variants/esp32p4/m5stack_tab5
  -DBOARD_HAS_PSRAM
;  -DCORE_DEBUG_LEVEL=5
  -D_ESP_LOGLEVEL_=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=0
  -D HAS_SDCARD
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D DISPLAY_SET_RESOLUTION
  -D RAM_SIZE=6144
  -D LV_CACHE_DEF_SIZE=2097152
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_BUILD_TEST=0
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D LGFX_ZOOM=2
  -D LGFX_SCREEN_WIDTH=360
  -D LGFX_SCREEN_HEIGHT=640
  -D DISPLAY_SIZE=360x640 ; portrait mode
;  -D LGFX_SCREEN_WIDTH=720
;  -D LGFX_SCREEN_HEIGHT=1280
;  -D DISPLAY_SIZE=720x1280 ; portrait mode
  -D LGFX_DRIVER=LGFX_M5TAB5
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_M5TAB5.h\"
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
  -D HAS_WIFI=1

monitor_speed=115200
build_src_filter = 
 ${esp32p4_base.build_src_filter} +<../variants/esp32p4/m5stack_tab5> +<../src/nimble>
lib_deps =
  ${esp32p4_base.lib_deps}
  ${device-ui_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.21
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
