; M5stack PaperMono
[env:m5stack-papermono]
extends = esp32s3_base
board_level = release
board = esp32-s3-devkitm-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
upload_protocol = esptool
;build_unflags =
;  -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
;  -DARDUINO_USB_MODE=1
build_flags = 
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D M5STACK_PAPERMONO
  -Dmy
  -I variants/esp32s3/m5stack_papermono
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DEINK_DISPLAY_MODEL=GxEPD2_397_GDEM0397T81
  -DEINK_WIDTH=480
  -DEINK_HEIGHT=800
;  -DCORE_DEBUG_LEVEL=5
;  -DARDUINO_USB_CDC_ON_BOOT=1
;  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=GxEPD2 packageName=zinggjm/library/GxEPD2
  zinggjm/GxEPD2@1.6.9
  # renovate: datasource=custom.pio depName=ArtronShop_RX8130CE packageName=artronshop/library/ArtronShop_RX8130CE
  artronshop/ArtronShop_RX8130CE@1.0.0
  m5stack/M5IOE1
  m5stack/M5PM1
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/m5stack_papermono>
