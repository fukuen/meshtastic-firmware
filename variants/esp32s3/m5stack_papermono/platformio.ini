; M5Stack PaperMono
[m5stack_papermono_base]
extends = esp32s3_base
board = esp32-s3-devkitm-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
upload_protocol = esptool

custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = M5STACK_PAPERMONO
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_ink_hud = false

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D M5STACK_PAPERMONO
  -D ESP32S3
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -I variants/esp32s3/m5stack_papermono
  -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/m5stack_papermono>
  -<graphics/EInkDisplay2.cpp>
  -<graphics/EInkDynamicDisplay.cpp>

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  # renovate: datasource=custom.pio depName=M5IOE1 packageName=m5stack/library/M5IOE1
  m5stack/M5IOE1
  # renovate: datasource=custom.pio depName=M5PM1 packageName=m5stack/library/M5PM1
  m5stack/M5PM1
  # renovate: datasource=custom.pio depName=ArtronShop_RX8130CE packageName=artronshop/library/ArtronShop_RX8130CE
  artronshop/ArtronShop_RX8130CE@1.0.0

; M5Stack PaperMono - BaseUI (E-Ink via LGFXEInkDisplay) and MeshtasticUI (LVGL via
; device-ui) in one build, switched by config.display.displaymode (COLOR = MUI).
[env:m5stack-papermono]
extends = m5stack_papermono_base
board_level = release
custom_meshtastic_display_name = M5Stack PaperMono
custom_meshtastic_has_mui = true

build_flags =
  ${m5stack_papermono_base.build_flags}
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_EINK
  -D USE_EINK_LGFX
  -D LGFX_DRIVER=LGFX_PAPERMONO
  -D VIEW_240x400
  -D DISPLAY_SIZE=240x400
  -D DISPLAY_SET_RESOLUTION
  -D RAM_SIZE=1024
  -D HAS_SDCARD ; must be a -D flag (not variant.h) so device-ui sources see it
  -D HAS_SD_MMC ; microSD is SDIO; device-ui SDCard::init() mounts it 1-bit
  -D SD_SCLK_PIN=13 ; SDIO CLK
  -D SD_MOSI_PIN=12 ; SDIO CMD
  -D SD_MISO_PIN=11 ; SDIO D0
  -D MAP_TILES_GREY ; 4-level greyscale map tiles for the E-Ink panel (decodeImgGrey)
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D USE_PACKET_API
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_VERBOSE_ASSERT=0
  -D RADIOLIB_SPI_PARANOID=0

lib_deps =
  ${m5stack_papermono_base.lib_deps}
  ${device-ui_base.lib_deps}

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
  CONFIG_FREERTOS_CHECK_STACKOVERFLOW=2